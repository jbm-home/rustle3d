[workspace]
resolver = "3"
members = [
    "crates/r3d-geom",
    "crates/r3d-avatar",
    "crates/r3d-core",
    "crates/r3d-sim",
    "crates/r3d-io",
    "crates/r3d-commands",
    "crates/r3d-render",
    "crates/r3d-mcp",
    "crates/r3d-cli",
    "crates/r3d-app",
    "crates/r3d-ffi",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/jbm-home/rustle3d"
publish = false

[workspace.dependencies]
r3d-geom = { path = "crates/r3d-geom" }
r3d-avatar = { path = "crates/r3d-avatar" }
r3d-core = { path = "crates/r3d-core" }
r3d-commands = { path = "crates/r3d-commands" }
r3d-io = { path = "crates/r3d-io" }
r3d-sim = { path = "crates/r3d-sim" }
r3d-render = { path = "crates/r3d-render" }
r3d-mcp = { path = "crates/r3d-mcp" }

assert_cmd = "2"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
glam = { version = "0.34", features = ["serde"] }
pdf-writer = "0.15"
png = "0.18"
pollster = "1"
proptest = "1"
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
spade = "2"
serde_json = "1"
tempfile = "3"
thiserror = "2"
ureq = "3"
wgpu = "30"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[workspace.lints.rust]
unsafe_code = "deny"
# flutter_rust_bridge's code generator expands with this cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Never-crash policy: no unwrap/expect/panic in non-test code (see CLAUDE.md).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.dev.package."*"]
# Dependencies are unusably slow unoptimized.
opt-level = 2

# Numeric crates of ours too: debug builds of the app must stay interactive.
[profile.dev.package.r3d-avatar]
opt-level = 2

[profile.dev.package.r3d-sim]
opt-level = 2

[profile.release]
lto = "thin"
