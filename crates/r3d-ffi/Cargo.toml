[package]
# Underscore on purpose: cargokit (which builds this crate inside the Flutter
# app) expects the library file to be named after the package.
name = "r3d_ffi"
description = "Bridge between the Flutter UI and the Rustle3D core (flutter_rust_bridge)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
r3d-avatar.workspace = true
r3d-core.workspace = true
r3d-commands.workspace = true
r3d-geom.workspace = true
r3d-render.workspace = true
flutter_rust_bridge = "=2.13.0"
serde_json.workspace = true
wgpu.workspace = true

# Zero-copy texture sharing with the Flutter compositor (IOSurface).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
