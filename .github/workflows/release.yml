name: Release

# Push a tag v<version> (the workspace version in Cargo.toml, e.g.
# v26.11.19): builds the app and the CLI on each OS with
# scripts/release.sh (a .dmg and a portable .zip on macOS, an installer and
# a portable .zip on Windows, a .tar.gz on Linux), then publishes a GitHub Release with the packages and
# SHA256SUMS.txt (unsigned). Run by hand (Actions tab > Release > Run
# workflow), it only builds and keeps the packages as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v$version" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Windows installer tool
        if: runner.os == 'Windows'
        run: command -v iscc || [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
      - run: ./scripts/release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: rustle3d-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Rustle3D ${GITHUB_REF_NAME#v}" \
            --notes "Rustle3D ${GITHUB_REF_NAME#v} for macOS (one disk image for Intel and Apple silicon), Windows (installer, x64; Windows on Arm runs it too) and Linux (x64). The .zip files for macOS and Windows are portable: unpack and run, nothing to install. The packages are not signed yet: see Installing in the user guide, https://app.rustle3d.com/en/guide/. Check a download against SHA256SUMS.txt. Source code: the archives below, or https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}."
