name: Release

# Push a tag v<version> (the workspace version in Cargo.toml, e.g.
# v26.11.19): builds the app and the CLI on each OS with
# scripts/release.sh, then publishes a GitHub Release with the packages
# and SHA256SUMS.txt (unsigned). Run by hand (Actions tab > Release > Run
# workflow), it only builds and keeps the packages as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v$version" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustle3d-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Rustle3D ${GITHUB_REF_NAME#v}" \
            --notes "Rustle3D ${GITHUB_REF_NAME#v} for macOS, Windows (x64) and Linux (x64). The packages are not signed yet: see Installing in the user guide, https://rustle3d.com/en/guide/. Check a download against SHA256SUMS.txt. Source code: the archives below, or https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}."
