name: Release builds

# Manual: Actions tab > Release builds > Run workflow. Builds the app and
# the CLI on each OS with scripts/release.sh and keeps the packages as
# artifacts (unsigned).
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustle3d-${{ matrix.os }}
          path: dist/*
