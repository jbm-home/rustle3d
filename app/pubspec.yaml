name: rustle3d
description: "Rustle3D desktop app: Flutter UI over the Rust core."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  r3d_ffi:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/demo_skirt.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
