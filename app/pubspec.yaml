name: rustle3d
description: "Rustle3D desktop app: Flutter UI over the Rust core."
publish_to: 'none'
version: 26.11.27

environment:
  sdk: ^3.14.0

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  r3d_ffi:
    path: rust_builder
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
